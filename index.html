<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheetBuilder</title>
    <script src="script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

    <div class="container-fluid min-vh-100 bg-warning text-black p-3 font-monospace" style="--bs-bg-opacity: .25">
        <div class=" container">
            <h1 class="display-4 fw-bold">RPG Character Sheet Builder</h1>
            <p class="lead">Create your own character sheet for your RPG adventures!</p>
        </div>
        <div class="container bg-warning-subtle border border-danger-subtle">
            <div class="row justify-content-around">
                <div class="col-auto">
                    <div class="mb-3"> <!-- name -->
                        <label for="name" class="form-label fs-1">Whats ur character name?</label>
                        <input type="email" class="form-control w-50" id="name" placeholder="Insert name here">
                    </div>
                </div>
                <div class="col-auto border border-danger-subtle mb-3"> <!-- points and credits -->
                    <div class="">
                        <div class="row text-center"> <label for="">Credits: <span id="cCred">0</span> <input
                                    type="button" class="btn " value="+" onclick="addCredits()"> <input type="button"
                                    class="btn" value="-" onclick="removeCredits()">
                            </label> </div>
                        <div class="row text-center"> <label for="">Investigative Points: <span
                                    id='investigativePoints'>18</span> <input type="button" class="btn" value="+"
                                    onclick="handleAddButton('investigativePoints')"> <input type="button" class="btn"
                                    value="-" onclick="handleRemoveButton('investigativePoints')"> </label> </div>
                        <div class="row text-center"><label for="">General Points: <span id="generalPoints">65</span>
                                <input type="button" class="btn" value="+" onclick="handleAddButton('generalPoints')">
                                <input type="button" class="btn" value="-"
                                    onclick="handleRemoveButton('generalPoints')"> </label> </div>
                    </div>
                </div>
            </div>

            <div class="row border border-danger-subtle mb-3 justify-content-center"> <!-- Personal Details -->
                <div class="col-9"> <!-- Occupation-->
                    <div class="mb-3">
                        <label for="occupation" class="form-label fs-3">What's your occupation?</label>
                        <!--Occupation selection-->
                        <select class="form-control w-50 bg-white-subtle text-black fs-6" id="occupation"
                            style="--bs-bg-opacity: .50" onchange="occupation(this.value)">
                            <option selected>Select an occupation</option>
                            <option value="1">Alienista</option>
                            <option value="2">Antiquario</option>
                            <option value="3">Andarilho</option>
                            <option value="4">Arqueólogo</option>
                            <option value="5">Artista</option>
                            <option value="6">Autor</option>
                            <option value="7">Cientista</option>
                            <option value="8">Clero</option>
                            <option value="9">Criminoso</option>
                            <option value="10">Detetive Particular</option>
                            <option value="11">Detetive Policial</option>
                            <option value="12">Diletante</option>
                            <option value="13">Enfermeira</option>
                            <option value="14">Jornalista</option>
                            <option value="15">Médico</option>
                            <option value="16">Militar</option>
                            <option value="17">Parapsicólogo</option>
                            <option value="18">Piloto</option>
                            <option value="19">Professor</option>
                        </select>

                        <!-- display occupation details -->
                        <div id="occupation-details">
                            <label class="form-label fs-5">show your occupation details here</label>
                            <div class="card" id="occupation-card" style="--bs-bg-opacity: .50;">
                                <div class="card-body bg-white text-black" style="max-height: 450px;">
                                    <img src="assets/criminoso.jpg" alt="occupation representation"
                                        class="card-img-top img-fluid h-50 w-auto" id="occupation-image">
                                    <h5 class="card-title" id="occupation-name">Occupation Name</h5>
                                    <p class="card-text" id="occupation-description">Occupation description and details
                                        go here.</p>
                                    <p class="card-text"> Credits: <span id="occupation-credits">0</span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row border border-danger-subtle mb-3 justify-content-center"> <!-- Motivations -->
                <label for="" class="form-label fs-3 text-center">
                    Select your motivations: (up to 3)
                </label>
                <div class="col-3"> <!-- motivations 1-5 -->
                    <div class="form-check fs-6"> <!-- Motivation 1 -->

                        <label class="form-check-label" for="1">
                            Antiquarianismo

                    </div>

                    </div>
                    <div class="form-check fs-6"> <!-- Motivation 14 -->

                        <label class="form-check-label" for="14">
